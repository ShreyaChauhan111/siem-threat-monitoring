# Forward auth and system logs from a Linux host to the SIEM collector.
# Install: copy to /etc/rsyslog.d/60-siem-forward.conf, set SIEM_HOST, then `sudo systemctl restart rsyslog`.
# Use RFC3339 timestamps so the mini SIEM parser (and most SIEMs) read times correctly.
template(name="SiemFormat" type="string"
         string="%timegenerated:::date-rfc3339% %hostname% %syslogtag%%msg:::sp-if-no-1st-sp%%msg%\n")

# TCP with queueing so logs survive short collector outages (use TLS in production).
auth,authpriv.*   action(type="omfwd" target="SIEM_HOST" port="514" protocol="tcp"
                         template="SiemFormat"
                         queue.type="LinkedList" queue.filename="siem_fwd"
                         queue.maxdiskspace="1g" queue.saveonshutdown="on"
                         action.resumeRetryCount="-1")
